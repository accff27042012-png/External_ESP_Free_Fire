name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git theos
          cd theos
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/* sdks/
          rm -rf sdks-master sdks.zip
          cd ..
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
          echo "$(pwd)/theos/bin" >> $GITHUB_PATH
      
      - name: Build
        run: |
          export THEOS=$(pwd)/theos
          mkdir -p packages
          
          # Đổi tên Tweak.xm thành Tweak.mm để compile
          cp Tweak.xm Tweak.mm
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -lz \
            Tweak.mm \
            -o packages/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -x objective-c++
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: packages/*.dylib
