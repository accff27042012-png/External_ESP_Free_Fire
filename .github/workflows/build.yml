name: Build with Theos
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git theos
          cd theos
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/* sdks/
          rm -rf sdks-master sdks.zip
          cd ..
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
          echo "$(pwd)/theos/bin" >> $GITHUB_PATH
      
      - name: Build with Theos
        run: |
          export THEOS=$(pwd)/theos
          make clean
          make package FINALPACKAGE=1
          find . -name "*.dylib" -exec cp {} output/ \;
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
