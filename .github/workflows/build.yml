name: Build Real Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Hack Dylib from esp/Core/
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # Tìm tất cả file .mm và .cpp trong esp/Core/
          SOURCES=$(find esp/Core -name "*.mm" -o -name "*.cpp" 2>/dev/null | tr '\n' ' ')

          if [ -z "$SOURCES" ]; then
            echo "❌ Không tìm thấy source trong esp/Core/"
            exit 1
          fi

          echo "📦 Compiling: $SOURCES"

          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -framework CoreImage \
            -Iesp \
            -Iesp/Core \
            -I. \
            -D_USE_MATH_DEFINES \
            $SOURCES \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -Wno-c++11-compat \
            -fpermissive

          # Kiểm tra kích thước file
          if [ -f "output/UltimateHack.dylib" ]; then
            SIZE=$(ls -l output/UltimateHack.dylib | awk '{print $5}')
            echo "✅ Build thành công! Kích thước: $SIZE bytes"
            if [ $SIZE -lt 50000 ]; then
              echo "⚠️ CẢNH BÁO: Dylib quá nhỏ ($SIZE bytes). Có thể source bị lỗi hoặc thiếu code."
            fi
            ls -la output/
          else
            echo "❌ Build thất bại, không tìm thấy output/UltimateHack.dylib"
            exit 1
          fi

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
          retention-days: 30
