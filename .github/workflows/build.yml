name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build UltimateHack.mm
        run: |
          mkdir -p output
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if [ ! -f "UltimateHack.mm" ]; then
            echo "❌ Không tìm thấy UltimateHack.mm"
            exit 1
          fi
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            UltimateHack.mm \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations
          ls -la output/
      
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
