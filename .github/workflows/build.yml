name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Hack Dylib
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Đường dẫn đúng: esp/Core/
          SOURCES=$(find esp/Core -name "*.mm" -o -name "*.cpp" | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "ERROR: Không tìm thấy file trong esp/Core/"
            exit 1
          fi
          
          echo "Found: $SOURCES"
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -framework CoreImage \
            $SOURCES \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -fpermissive
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
