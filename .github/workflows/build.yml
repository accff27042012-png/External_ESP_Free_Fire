name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test.mm
        run: |
          echo '#import <UIKit/UIKit.h>' > test.mm
          echo '__attribute__((constructor)) static void init() { NSLog(@"Hello"); }' >> test.mm

      - name: Build test.mm
        run: |
          mkdir -p output
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -framework UIKit \
            -framework Foundation \
            test.mm \
            -o output/test.dylib \
            -install_name @rpath/test.dylib \
            -fobjc-arc
          ls -la output/

      - name: Upload test.dylib
        uses: actions/upload-artifact@v4
        with:
          name: test-dylib
          path: output/*.dylib
