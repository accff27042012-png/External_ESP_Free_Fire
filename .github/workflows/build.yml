name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Dylib from Core only
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # CHỈ LẤY FILE TRONG esp/Core/
          SOURCES=$(find esp/Core -name "*.mm" -o -name "*.cpp" 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "❌ Không tìm thấy source trong esp/Core/"
            exit 1
          fi
          
          echo "📦 Compiling: $SOURCES"
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -framework CoreImage \
            -I. \
            -Iesp \
            -DARM64=1 \
            $SOURCES \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -Wno-c++11-compat \
            -fpermissive
          
          echo "✅ Build completed!"
          ls -la output/
      
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
