name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git theos
          cd theos
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/* sdks/
          rm -rf sdks-master sdks.zip
          cd ..
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
          echo "$(pwd)/theos/bin" >> $GITHUB_PATH
      
      - name: Build Dylib directly (skip package)
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export THEOS=$(pwd)/theos
          
          # Tìm tất cả file .mm và .cpp
          SOURCES=$(find esp sources -name "*.mm" -o -name "*.cpp" 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "⚠️ Không tìm thấy source, thử tìm trong Core/"
            SOURCES=$(find Core -name "*.mm" -o -name "*.cpp" 2>/dev/null | tr '\n' ' ')
          fi
          
          if [ -z "$SOURCES" ]; then
            echo "❌ Không tìm thấy source nào"
            exit 1
          fi
          
          echo "📦 Compiling: $SOURCES"
          
          # Thử compile với các cờ cần thiết
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -framework CoreImage \
            -I$(pwd)/theos/include \
            -I. \
            $SOURCES \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -Wno-c++11-compat \
            -fpermissive \
            -DARM64=1
          
          echo "✅ Build completed!"
          ls -la output/
      
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
