name: Build Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Dylib with Xcode SDK
        run: |
          mkdir -p packages
          
          # Đổi tên Tweak.xm thành Tweak.mm
          cp Tweak.xm Tweak.mm
          
          # Lấy đường dẫn iOS SDK từ Xcode
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -lz \
            Tweak.mm \
            -o packages/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -x objective-c++
          
          # Kiểm tra kết quả
          ls -la packages/
      
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: packages/*.dylib
