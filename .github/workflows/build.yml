name: Build Dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build UltimateHack.mm
        run: |
          mkdir -p output
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Kiểm tra file tồn tại
          if [ ! -f "UltimateHack.mm" ]; then
            echo "❌ Không tìm thấy UltimateHack.mm"
            exit 1
          fi
          
          echo "📦 Building UltimateHack.mm..."
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            UltimateHack.mm \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable
          
          # Hiển thị kích thước
          ls -la output/
          
          if [ -f "output/UltimateHack.dylib" ]; then
            SIZE=$(ls -l output/UltimateHack.dylib | awk '{print $5}')
            echo "✅ Build thành công! Kích thước: $SIZE bytes"
          else
            echo "❌ Build thất bại"
            exit 1
          fi
      
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
