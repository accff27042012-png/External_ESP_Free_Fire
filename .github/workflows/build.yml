name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git theos
          mkdir -p theos/sdks
          cd theos/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o master.zip
          unzip -q master.zip
          mv sdks-master/* ./
          rm -rf sdks-master master.zip
          cd ../..
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
      
      - name: Build Dylib with Theos
        run: |
          export THEOS=$(pwd)/theos
          make package FINALPACKAGE=1
        continue-on-error: true
      
      - name: Build with Clang (fallback)
        run: |
          mkdir -p output
          clang++ -arch arm64 -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            Core/*.mm \
            Core/*.cpp \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable
        continue-on-error: true
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
