name: Build Full Dylib
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build All Sources
        run: |
          mkdir -p packages
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Tìm tất cả file .mm và .cpp trong toàn bộ dự án
          SOURCES=$(find esp sources -name "*.mm" -o -name "*.cpp" 2>/dev/null | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "❌ Không tìm thấy source"
            exit 1
          fi
          
          echo "📦 Compiling: $SOURCES"
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -lz \
            -Iesp/Core \
            -Iheaders \
            -I. \
            $SOURCES \
            -o packages/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -fobjc-arc \
            -std=c++14 \
            -O3 \
            -Wno-deprecated-declarations \
            -Wno-unused-variable \
            -fpermissive
          
          ls -la packages/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: packages/*.dylib
