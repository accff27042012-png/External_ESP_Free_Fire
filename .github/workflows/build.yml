name: Build Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Dylib
        run: |
          mkdir -p output
          clang++ -arch arm64 -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework OpenGLES \
            -framework Metal \
            -o output/UltimateHack.dylib \
            -install_name @rpath/UltimateHack.dylib \
            -x objective-c++ \
            - <<'EOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          
          __attribute__((constructor)) static void init() {
              NSLog(@"[Hack] Loaded!");
              UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@"Hack" message:@"Loaded!" delegate:nil cancelButtonTitle:@"OK" otherButtonTitles:nil];
              [alert show];
          }
          EOF
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateHack
          path: output/*.dylib
